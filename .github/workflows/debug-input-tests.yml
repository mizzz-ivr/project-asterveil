name: Debug Input Tests

on:
  pull_request:
    branches:
      - '**'

jobs:
  debug-input-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Capture focused test output
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_input_action_presentation -v > debug-output.txt 2>&1
          echo "$?" > debug-status.txt
          exit 0

      - name: Upload debug output
        uses: actions/upload-artifact@v4
        with:
          name: input-test-debug
          path: |
            debug-output.txt
            debug-status.txt
