name: Chapter Content Promotion Validation

on:
  push:
    paths:
      - 'README.md'
      - 'content/master_catalog_v1.json'
      - 'content/packs/**'
      - 'data/master/**'
      - 'game/app/infrastructure/dialogue_event_repository.py'
      - 'game/battle/infrastructure/master_data_repository.py'
      - 'game/location/infrastructure/master_data_repository.py'
      - 'game/quest/infrastructure/master_data_repository.py'
      - 'tools/chapter_content_pack.py'
      - 'tools/chapter_content_promotion.py'
      - 'tools/content_promotion/**'
      - 'tests/test_chapter_content_pack.py'
      - 'tests/test_chapter_content_promotion.py'
      - 'tests/test_chapter_content_promotion_contracts.py'
      - 'tests/test_chapter_content_promotion_bundle.py'
      - 'tests/fixtures/chapter_content_promotion/**'
      - 'docs/CHAPTER_CONTENT_PROMOTION.md'
      - 'docs/CHAPTER_CONTENT_PROMOTION_BUNDLE.md'
      - '.github/workflows/chapter-content-promotion.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'content/master_catalog_v1.json'
      - 'content/packs/**'
      - 'data/master/**'
      - 'game/app/infrastructure/dialogue_event_repository.py'
      - 'game/battle/infrastructure/master_data_repository.py'
      - 'game/location/infrastructure/master_data_repository.py'
      - 'game/quest/infrastructure/master_data_repository.py'
      - 'tools/chapter_content_pack.py'
      - 'tools/chapter_content_promotion.py'
      - 'tools/content_promotion/**'
      - 'tests/test_chapter_content_pack.py'
      - 'tests/test_chapter_content_promotion.py'
      - 'tests/test_chapter_content_promotion_contracts.py'
      - 'tests/test_chapter_content_promotion_bundle.py'
      - 'tests/fixtures/chapter_content_promotion/**'
      - 'docs/CHAPTER_CONTENT_PROMOTION.md'
      - 'docs/CHAPTER_CONTENT_PROMOTION_BUNDLE.md'
      - '.github/workflows/chapter-content-promotion.yml'

jobs:
  validate-chapter-content-promotion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run content pack and promotion contract tests
        run: |
          python -m unittest \
            tests.test_chapter_content_pack \
            tests.test_chapter_content_promotion \
            tests.test_chapter_content_promotion_contracts \
            tests.test_chapter_content_promotion_bundle \
            -v

      - name: Validate fixture against current Master Catalog
        run: |
          python tools/chapter_content_promotion.py \
            --catalog content/master_catalog_v1.json \
            --project-root . \
            validate tests/fixtures/chapter_content_promotion/pack.external_refs.json

      - name: Generate promotion review artifacts
        run: |
          python tools/chapter_content_promotion.py \
            --catalog content/master_catalog_v1.json \
            --project-root . \
            plan tests/fixtures/chapter_content_promotion/pack.external_refs.json \
            --output tmp/chapter-content-promotion

      - name: Verify promotion plan contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("tmp/chapter-content-promotion")
          plan = json.loads((root / "PROMOTION_PLAN.json").read_text(encoding="utf-8"))
          assert plan["status"] == "ready_for_review", plan
          assert plan["apply_supported"] is False
          assert not plan["unresolved_references"]
          assert not plan["conflicts"]
          assert plan["classifications"]["quests"]["add"] == ["quest.ch02.promotion_check"]
          assert (root / "PROMOTION_SUMMARY.md").exists()
          assert (root / "localization.ja.candidates.json").exists()
          print("promotion plan verified")
          PY

      - name: Generate promotion patch bundle
        run: |
          python tools/chapter_content_promotion.py \
            --catalog content/master_catalog_v1.json \
            --project-root . \
            bundle tests/fixtures/chapter_content_promotion/pack.external_refs.json \
            --output tmp/chapter-content-promotion-bundle

      - name: Verify bundle and dry-run apply
        run: |
          python tools/chapter_content_promotion.py \
            --catalog content/master_catalog_v1.json \
            --project-root . \
            verify-bundle tmp/chapter-content-promotion-bundle/bundle

          CATALOG_SHA=$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(
              Path("tmp/chapter-content-promotion-bundle/bundle/BUNDLE_MANIFEST.json").read_text(encoding="utf-8")
          )
          print(manifest["source_catalog_sha256"])
          PY
          )

          python tools/chapter_content_promotion.py \
            --catalog content/master_catalog_v1.json \
            --project-root . \
            apply-bundle tmp/chapter-content-promotion-bundle/bundle \
            --confirm-catalog-sha "$CATALOG_SHA"

          git diff --exit-code -- data/master

      - name: Verify bundle contract
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("tmp/chapter-content-promotion-bundle")
          bundle = root / "bundle"
          manifest = json.loads((bundle / "BUNDLE_MANIFEST.json").read_text(encoding="utf-8"))
          assert manifest["bundle_type"] == "chapter_content_promotion_add_only"
          assert manifest["mode"] == "add_only"
          assert manifest["files"]
          assert manifest["source_catalog_sha256"] != manifest["expected_catalog_sha256"]
          assert all(value["added_ids"] for value in manifest["files"])
          assert all((bundle / value["candidate_path"]).exists() for value in manifest["files"])
          assert all((bundle / value["diff_path"]).exists() for value in manifest["files"])
          source_pack = bundle / manifest["source_pack_path"]
          assert source_pack.exists()
          assert hashlib.sha256(source_pack.read_bytes()).hexdigest() == manifest["source_pack_file_sha256"]
          assert (bundle / "BUNDLE_SUMMARY.md").exists()
          assert (root / "plan/PROMOTION_PLAN.json").exists()
          print("promotion bundle verified")
          PY

      - name: Validate Chapter 2 pack against current Master Catalog
        run: |
          python tools/chapter_content_promotion.py \
            --catalog content/master_catalog_v1.json \
            --project-root . \
            validate content/packs/ch02/pack.json

      - name: Generate Chapter 2 promotion review artifacts
        run: |
          python tools/chapter_content_promotion.py \
            --catalog content/master_catalog_v1.json \
            --project-root . \
            plan content/packs/ch02/pack.json \
            --output tmp/ch02-content-promotion

      - name: Verify Chapter 2 promotion plan contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(
              Path("tmp/ch02-content-promotion/PROMOTION_PLAN.json").read_text(encoding="utf-8")
          )
          assert plan["status"] == "ready_for_review", plan
          assert not plan["unresolved_references"], plan["unresolved_references"]
          assert not plan["conflicts"], plan["conflicts"]
          for kind, classification in plan["classifications"].items():
              assert classification["conflict"] == [], (kind, classification)
              assert not (set(classification["add"]) & set(classification["unchanged"])), (
                  kind,
                  classification,
              )
          print("Chapter 2 promotion plan verified")
          PY

      - name: Detect Chapter 2 promotion additions
        id: chapter2_changes
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          plan = json.loads(
              Path("tmp/ch02-content-promotion/PROMOTION_PLAN.json").read_text(encoding="utf-8")
          )
          has_additions = any(
              classification["add"]
              for classification in plan["classifications"].values()
          )
          print(f"has_additions={'true' if has_additions else 'false'}")
          PY

      - name: Generate Chapter 2 promotion patch bundle
        if: steps.chapter2_changes.outputs.has_additions == 'true'
        run: |
          python tools/chapter_content_promotion.py \
            --catalog content/master_catalog_v1.json \
            --project-root . \
            bundle content/packs/ch02/pack.json \
            --output tmp/ch02-content-promotion-bundle

      - name: Verify Chapter 2 bundle and dry-run apply
        if: steps.chapter2_changes.outputs.has_additions == 'true'
        run: |
          python tools/chapter_content_promotion.py \
            --catalog content/master_catalog_v1.json \
            --project-root . \
            verify-bundle tmp/ch02-content-promotion-bundle/bundle

          CATALOG_SHA=$(python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(
              Path("tmp/ch02-content-promotion-bundle/bundle/BUNDLE_MANIFEST.json").read_text(encoding="utf-8")
          )
          print(manifest["source_catalog_sha256"])
          PY
          )

          python tools/chapter_content_promotion.py \
            --catalog content/master_catalog_v1.json \
            --project-root . \
            apply-bundle tmp/ch02-content-promotion-bundle/bundle \
            --confirm-catalog-sha "$CATALOG_SHA"

          git diff --exit-code -- data/master

      - name: Verify Chapter 2 bundle matches promotion plan
        if: steps.chapter2_changes.outputs.has_additions == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(
              Path("tmp/ch02-content-promotion/PROMOTION_PLAN.json").read_text(encoding="utf-8")
          )
          bundle = Path("tmp/ch02-content-promotion-bundle/bundle")
          manifest = json.loads((bundle / "BUNDLE_MANIFEST.json").read_text(encoding="utf-8"))

          expected = {
              kind: sorted(classification["add"])
              for kind, classification in plan["classifications"].items()
              if classification["add"]
          }
          actual = {
              entry["kind"]: sorted(entry["added_ids"])
              for entry in manifest["files"]
          }
          assert manifest["bundle_type"] == "chapter_content_promotion_add_only"
          assert manifest["mode"] == "add_only"
          assert actual == expected, (actual, expected)
          assert all((bundle / entry["candidate_path"]).exists() for entry in manifest["files"])
          assert all((bundle / entry["diff_path"]).exists() for entry in manifest["files"])
          print("Chapter 2 promotion bundle verified")
          PY

      - name: Upload promotion review artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: chapter-content-promotion-${{ github.sha }}
          path: |
            tmp/chapter-content-promotion
            tmp/chapter-content-promotion-bundle
            tmp/ch02-content-promotion
            tmp/ch02-content-promotion-bundle
          if-no-files-found: warn
          retention-days: 14
