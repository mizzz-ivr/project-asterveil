name: Diagnose Item Equipment Tests

on:
  push:
    branches:
      - feature/item-equipment-screen

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run target tests
        id: target
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest tests.test_item_equipment_screen -v 2>&1 | tee item-equipment-test.log
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: item-equipment-test-log
          path: item-equipment-test.log
      - name: Fail when tests failed
        if: steps.target.outcome == 'failure'
        run: exit 1
