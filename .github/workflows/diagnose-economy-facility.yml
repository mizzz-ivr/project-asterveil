name: Diagnose Economy Facility Tests

on:
  push:
    branches:
      - feature/shop-crafting-inn-screen
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run target tests
        id: target
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest tests.test_economy_facility_screen -v 2>&1 | tee economy-facility-test.log
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: economy-facility-test-log
          path: economy-facility-test.log
      - name: Fail when tests failed
        if: steps.target.outcome == 'failure'
        run: exit 1
