name: Diagnose Screen Runtime Tests

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run runtime tests
        id: runtime
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest tests.test_screen_runtime tests.test_screen_runtime_initialization tests.test_steam_demo_composition tests.test_shared_action_screen_controller -v 2>&1 | tee screen-runtime-target.log
      - name: Run all tests
        id: all
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest 2>&1 | tee screen-runtime-all.log
      - name: Upload diagnostic logs
        uses: actions/upload-artifact@v4
        with:
          name: screen-runtime-test-logs
          path: |
            screen-runtime-target.log
            screen-runtime-all.log
      - name: Fail when tests failed
        if: steps.runtime.outcome == 'failure' || steps.all.outcome == 'failure'
        run: exit 1
