name: Chapter 2 Promotion Apply Temporary

on:
  push:
    branches:
      - feature/ch02-fog-keeper-conversations
    paths:
      - '.github/workflows/ch02-promotion-apply-temp.yml'

permissions:
  contents: write

jobs:
  apply-reviewed-candidate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/ch02-fog-keeper-conversations
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate and verify Chapter 2 bundle
        run: |
          set -Eeuo pipefail
          python tools/chapter_content_promotion.py \
            --catalog content/master_catalog_v1.json \
            --project-root . \
            bundle content/packs/ch02/pack.json \
            --output tmp/ch02-reviewed-promotion

          python tools/chapter_content_promotion.py \
            --catalog content/master_catalog_v1.json \
            --project-root . \
            verify-bundle tmp/ch02-reviewed-promotion/bundle

      - name: Verify reviewed manifest contract
        id: manifest
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path('tmp/ch02-reviewed-promotion/bundle/BUNDLE_MANIFEST.json').read_text(encoding='utf-8')
          )
          assert manifest['source_catalog_sha256'] == '7d5fff5b0b94e59f8ca825d325fbc78e4680f28396edcf145eb8239a0702366d'
          assert manifest['expected_catalog_sha256'] == 'c0de92e4f434937313e075d643c72e14fd1eb69e491143dc981654a6217cc293'
          assert len(manifest['files']) == 1
          entry = manifest['files'][0]
          assert entry['kind'] == 'conversations'
          assert entry['target_path'] == 'data/master/dialogues.sample.json'
          assert entry['before_sha256'] == '3442c4692e2c99994149e56d6e5aacb112b68af2e4e09cfb9deae8fdebf88e68'
          assert entry['after_sha256'] == '1a2dc2b5fd994a1c74c21f9d06aaadcc0def7ec0079975ad4d314248fa866e12'
          assert len(entry['added_ids']) == 15
          print('reviewed manifest verified')
          PY

      - name: Apply reviewed bundle
        run: |
          set -Eeuo pipefail
          python tools/chapter_content_promotion.py \
            --catalog content/master_catalog_v1.json \
            --project-root . \
            apply-bundle tmp/ch02-reviewed-promotion/bundle \
            --confirm-catalog-sha 7d5fff5b0b94e59f8ca825d325fbc78e4680f28396edcf145eb8239a0702366d \
            --write

      - name: Verify exact applied file
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('data/master/dialogues.sample.json')
          data = path.read_bytes()
          assert hashlib.sha256(data).hexdigest() == '1a2dc2b5fd994a1c74c21f9d06aaadcc0def7ec0079975ad4d314248fa866e12'
          rows = json.loads(data.decode('utf-8'))
          assert len(rows) == 52
          ids = {row['entry_id'] for row in rows}
          expected = {
              'dialogue.ch02.fog_keeper.first_trace_offer',
              'dialogue.ch02.fog_keeper.first_trace_progress',
              'dialogue.ch02.fog_keeper.first_trace_ready',
              'dialogue.ch02.fog_keeper.marsh_patrol_offer',
              'dialogue.ch02.fog_keeper.marsh_patrol_progress',
              'dialogue.ch02.fog_keeper.marsh_patrol_ready',
              'dialogue.ch02.fog_keeper.mist_trace_offer',
              'dialogue.ch02.fog_keeper.mist_trace_progress',
              'dialogue.ch02.fog_keeper.echo_patrol_offer',
              'dialogue.ch02.fog_keeper.echo_patrol_progress',
              'dialogue.ch02.fog_keeper.echo_patrol_ready',
              'dialogue.ch02.fog_keeper.boss_offer',
              'dialogue.ch02.fog_keeper.boss_progress',
              'dialogue.ch02.fog_keeper.boss_ready',
              'dialogue.ch02.fog_keeper.chapter_clear',
          }
          assert expected <= ids
          print('exact candidate file verified')
          PY

          mapfile -t changed < <(git diff --name-only)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "data/master/dialogues.sample.json" ]]; then
            printf 'unexpected changed files:\n%s\n' "${changed[@]}"
            exit 1
          fi

      - name: Commit reviewed candidate only
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/master/dialogues.sample.json
          git commit -m '霧守セラConversationのPromotion CandidateをMasterへ反映'
          git push origin HEAD:feature/ch02-fog-keeper-conversations
